name: Deploy to GitHub Pages

on:
  push:
    branches: [master, claude/build-liberland-webpage-K3j1g, claude/build-what-was-removed-rrbeth]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate Fasto pages (news are edited in /fasto/admin/)
        run: python3 fasto/build.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r liberland-limited/. _site/
          cp -r new-site _site/candidate
          cp -r votula _site/votula
          cp -r build-what-was-removed _site/fund
          cp -r fasto _site/fasto
          # Test preview of the reformy.cz /o-spolku/ page (noindex; production is reformy.cz).
          python3 reformy-cz/build_test_page.py _site/reformy
          # Fasto lives at https://fasto.ll.land (mirrored from fasto/ by michalptacnik/fasto).
          # Keep the files here, but turn the pages into redirects to the same path there.
          for p in "" en/ hr/ admin/; do
            url="https://fasto.ll.land/$p"
            cat > "_site/fasto/${p}index.html" <<EOF
          <!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Fasto</title>
          <meta name="robots" content="noindex"><link rel="canonical" href="$url">
          <script>location.replace("$url"+location.search+location.hash)</script>
          <meta http-equiv="refresh" content="0; url=$url"></head>
          <body><a href="$url">fasto.ll.land</a></body></html>
          EOF
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
