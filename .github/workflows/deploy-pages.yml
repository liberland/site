name: Deploy to GitHub Pages

on:
  push:
    branches: [master, claude/build-liberland-webpage-K3j1g, claude/build-what-was-removed-rrbeth]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate Fasto pages (news are edited in /fasto/admin/)
        run: python3 fasto/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Christmas Gala page (Vite + React, prerendered)
        working-directory: christmas-gala
        run: npm install --no-audit --no-fund && npm run build
      - name: Build the 12th Anniversary 2027 page (served at /anniversary until anniversary.ll.land is live)
        working-directory: anniversary-2027
        env:
          BASE_PATH: /anniversary/
          SITE_URL: https://liberlandlimited.com/anniversary/
        run: npm install --no-audit --no-fund && npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r liberland-limited/. _site/
          cp -r new-site _site/candidate
          cp -r votula _site/votula
          cp -r build-what-was-removed _site/fund
          cp -r fasto _site/fasto
          # Liberland Grand Christmas Gala 2026. Its home is https://christmas.ll.land (mirrored from
          # christmas-gala/ by michalptacnik/christmas). Until that domain answers, keep serving the full
          # page here; once it does, /christmas becomes a redirect to it (same pattern as Fasto).
          if curl -fsS --max-time 20 https://christmas.ll.land/version.txt >/dev/null 2>&1; then
            # English at /christmas/, Simplified Chinese at /christmas/zh/ -> the same pages there.
            for p in "" zh/; do
              url="https://christmas.ll.land/$p"
              mkdir -p "_site/christmas/$p"
              cat > "_site/christmas/${p}index.html" <<EOF
          <!doctype html><html><head><meta charset="utf-8"><title>Liberland Grand Christmas Gala 2026</title>
          <meta name="robots" content="noindex"><link rel="canonical" href="$url">
          <script>location.replace("$url"+location.search+location.hash)</script>
          <meta http-equiv="refresh" content="0; url=$url"></head>
          <body><a href="$url">christmas.ll.land</a></body></html>
          EOF
            done
          else
            cp -r christmas-gala/dist _site/christmas
          fi
          # Liberland 12th Anniversary 2027. Its home is https://anniversary.ll.land (mirrored from anniversary-2027/
          # by michalptacnik/anniversary). Until that domain serves the new site — its /version.txt holds a commit
          # hash, which the 2026 site there never does — keep serving the full page here; then /anniversary
          # becomes a redirect to it (same pattern as Christmas and Fasto).
          if curl -fsS --max-time 20 https://anniversary.ll.land/version.txt 2>/dev/null | grep -qE '^[0-9a-f]{40}$'; then
            mkdir -p _site/anniversary
            cat > _site/anniversary/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Liberland 12th Anniversary 2027</title>
          <meta name="robots" content="noindex"><link rel="canonical" href="https://anniversary.ll.land/">
          <script>location.replace("https://anniversary.ll.land/"+location.search+location.hash)</script>
          <meta http-equiv="refresh" content="0; url=https://anniversary.ll.land/"></head>
          <body><a href="https://anniversary.ll.land/">anniversary.ll.land</a></body></html>
          EOF
          else
            cp -r anniversary-2027/dist _site/anniversary
          fi
          # Test preview of the reformy.cz /o-spolku/ page (noindex; production is reformy.cz).
          python3 reformy-cz/build_test_page.py _site/reformy
          # Fasto lives at https://fasto.ll.land (mirrored from fasto/ by michalptacnik/fasto).
          # Keep the files here, but turn the pages into redirects to the same path there.
          for p in "" en/ hr/ admin/; do
            url="https://fasto.ll.land/$p"
            cat > "_site/fasto/${p}index.html" <<EOF
          <!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Fasto</title>
          <meta name="robots" content="noindex"><link rel="canonical" href="$url">
          <script>location.replace("$url"+location.search+location.hash)</script>
          <meta http-equiv="refresh" content="0; url=$url"></head>
          <body><a href="$url">fasto.ll.land</a></body></html>
          EOF
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
