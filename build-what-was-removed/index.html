<!-- NOINDEX WHILE THIS IS A DRAFT.
     The page is publicly reachable so it can be reviewed, but it should not
     be indexed yet: no payment method is enabled, the recipient legal entity
     and Croatian-counsel sign-off are still open (see LEGAL-REVIEW-CHECKLIST.md),
     and the content makes allegations about identifiable public authorities in
     a live territorial dispute. Search engines should not carry that until it
     is signed off.
     Note that /fund/robots.txt is NOT consulted by crawlers — only the robots
     file at the domain root is — so this meta tag is what actually governs
     indexing for this site at a subpath.
     TO GO LIVE: change the content attribute below to
     "index, follow, max-image-preview:large". Deliberately spelled out
     rather than shown as a ready-made tag — a complete robots meta sitting
     in a comment on the one page that must not be indexed is too easy to
     uncomment by accident. -->
<meta name="robots" content="noindex, nofollow">
